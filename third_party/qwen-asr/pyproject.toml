[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-asr"
version = "0.0.6"
description = "Qwen-ASR python package (local tf5-compat fork: check_model_inputs patch for transformers 5.x)"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Alibaba Qwen Team" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Mirrors upstream qwen-asr 0.0.6 deps, except `transformers` is relaxed from
# the hard ==4.57.6 pin to >=4.57 so the fork imports on transformers 5.x
# (the single incompatibility this fork exists to fix).
dependencies = [
    "transformers>=4.57",
    "nagisa==0.2.11",
    "soynlp==0.0.493",
    "accelerate==1.12.0",
    "qwen-omni-utils",
    "librosa",
    "soundfile",
    "sox",
    "gradio",
    "flask",
    "pytz",
]

[project.optional-dependencies]
vllm = ["vllm==0.14.0"]

[project.scripts]
qwen-asr-demo = "qwen_asr.cli.demo:main"
qwen-asr-demo-streaming = "qwen_asr.cli.demo_streaming:main"
qwen-asr-serve = "qwen_asr.cli.serve:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qwen_asr = ["inference/assets/*.dict"]
